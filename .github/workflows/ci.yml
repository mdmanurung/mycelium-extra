name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The legs run in the official python images. Not -slim: those have no git, and the
        # git tests would skip, not fail. The images set LANG=C.UTF-8; the 3.9 leg (the oldest
        # supported) runs under C, as bare HPC shells do.
        include:
          - {image: "python:3.9-bookworm", locale: C}
          - {image: "python:3.12-bookworm", locale: C.UTF-8}
          - {image: "python:3.14-bookworm", locale: C.UTF-8}
    container: ${{ matrix.image }}
    env:
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Unit and end-to-end tests
        shell: bash
        run: |
          fail=0
          for t in hooks/tests/test_*.py skills/*/tests/test_*.py tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
      - name: Ablations
        run: python3 tests/e2e/ablate.py
      - name: Links
        # The historical patch snapshot includes changed files only.
        run: python3 tests/check_links.py $(git ls-files '*.md' ':!:mycelium-extra-improvements/**')

  gate-diff:
    # Pull requests get it automatically; `gh workflow run CI` (or the Actions button) does it on
    # demand, because the base is fixed and a push to main can drift from the oracle unnoticed.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: python:3.14-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Gate decisions against the pinned base
        run: |
          python3 hooks/tests/gate_diff.py --base 267d9e244d1f50abef2d024c9632c50df1911823 --expect hooks/tests/gate_diff_expected.json
          python3 hooks/tests/gate_diff.py --self-check

  opencode-plugin:
    name: OpenCode adapter (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adapter tests
        # The adapter spawns hooks/py.sh; the runner's python3 (3.12) is recorded through
        # MYCELIUM_EXTRA_PYTHON by the test, so a 3.6-only machine still exercises the gate.
        run: node --test opencode/tests/gate.test.js
      - name: Report viewer
        # The Python legs run in images without Node and skip the viewer tests; here Node exists, so they must run.
        run: |
          MX_REQUIRE_NODE=1 python3 skills/track-changes/tests/test_track_changes.py
          MX_REQUIRE_NODE=1 python3 skills/track-changes/tests/test_journal.py
