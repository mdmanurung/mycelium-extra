<style>/* Hallmark · component: report viewer · genre: modern-minimal · theme: custom (tinted-neutral paper, one blue accent)

:root {
  --paper: oklch(98.6% 0.004 90);
  --paper-2: oklch(96.2% 0.005 90);
  --ink: oklch(22% 0.012 90);
  --ink-2: oklch(46% 0.012 90);
  --rule: oklch(91% 0.006 90);
  --rule-strong: oklch(80% 0.008 90);
  --accent: oklch(48% 0.14 255);
  --focus: oklch(48% 0.14 255);
  --st-attention: oklch(64% 0.14 55);
  --st-authorized: oklch(58% 0.11 155);
  --st-routine: oklch(68% 0.01 90);
  --add: oklch(95.5% 0.04 155);
  --del: oklch(95.5% 0.035 25);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 40px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 120ms;
}
:root[data-theme="dark"] {
  --paper: oklch(19% 0.008 90);
  --paper-2: oklch(23% 0.01 90);
  --ink: oklch(93% 0.008 90);
  --ink-2: oklch(72% 0.01 90);
  --rule: oklch(29% 0.01 90);
  --rule-strong: oklch(40% 0.012 90);
  --accent: oklch(76% 0.12 255);
  --focus: oklch(76% 0.12 255);
  --st-attention: oklch(76% 0.13 60);
  --st-authorized: oklch(74% 0.11 155);
  --st-routine: oklch(60% 0.01 90);
  --add: oklch(28% 0.05 155);
  --del: oklch(28% 0.05 25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(19% 0.008 90);
    --paper-2: oklch(23% 0.01 90);
    --ink: oklch(93% 0.008 90);
    --ink-2: oklch(72% 0.01 90);
    --rule: oklch(29% 0.01 90);
    --rule-strong: oklch(40% 0.012 90);
    --accent: oklch(76% 0.12 255);
    --focus: oklch(76% 0.12 255);
    --st-attention: oklch(76% 0.13 60);
    --st-authorized: oklch(74% 0.11 155);

    --add: oklch(28% 0.05 155);
    --del: oklch(28% 0.05 25);
  }
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
#app { max-width: 1080px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }
h1, h2, h3, p, dl, dd { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono, code { font-family: var(--font-mono); font-size: 0.9em; }
code { background: var(--paper-2); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.mute { color: var(--ink-2); }

/* page header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-md); flex-wrap: wrap; }
.title { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; min-width: 0; }
.sub { color: var(--ink-2); font-size: 0.875rem; margin-top: var(--space-xs); }
.tools { display: flex; gap: var(--space-sm); }
.btn { background: transparent; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 12px; font-size: 0.875rem; line-height: 1.4; white-space: nowrap; transition: background-color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out); }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn[data-state="done"] { border-color: var(--st-authorized); color: var(--st-authorized); }
.btn[data-state="failed"] { border-color: var(--st-attention); color: var(--st-attention); }
.btn:disabled { opacity: 0.5; cursor: default; }

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm) var(--space-lg); margin-top: var(--space-md); font-size: 0.875rem; }
.meta .wide { grid-column: 1 / -1; }
.meta dt { color: var(--ink-2); font-size: 0.8125rem; }
.meta dd { overflow-wrap: anywhere; }
.fine { margin-top: var(--space-md); color: var(--ink-2); font-size: 0.8125rem; max-width: 72ch; }
details.limits { margin-top: var(--space-sm); font-size: 0.8125rem; color: var(--ink-2); }
details.limits summary { cursor: pointer; width: fit-content; }
details.limits ul { margin: var(--space-sm) 0 0; padding-left: 1.1em; max-width: 72ch; }

/* level 1: views */
.views { display: flex; gap: var(--space-lg); margin-top: var(--space-lg); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.view { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 0; color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: color var(--dur) var(--ease-out); }
.view:hover { color: var(--ink); }
.view[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.view .n { margin-left: 6px; color: var(--ink-2); font-weight: 400; font-variant-numeric: tabular-nums; }

/* level 2: filters inside the Review view, directly under the view strip */
.filters { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); flex-wrap: wrap; padding: var(--space-md) 0 var(--space-sm); }
.seg { display: flex; gap: var(--space-xs); flex-wrap: wrap; }
.chip { background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 10px; color: var(--ink-2); font-size: 0.875rem; white-space: nowrap; transition: background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out); }
.chip:hover { background: var(--paper-2); color: var(--ink); }
.chip:active { transform: translateY(1px); }
.chip[aria-pressed="true"] { background: var(--paper-2); border-color: var(--rule-strong); color: var(--ink); }
.chip .n { margin-left: 4px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.search { background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 10px; font-size: 0.875rem; width: 240px; max-width: 100%; }
.search::placeholder { color: var(--ink-2); }

/* list and detail: one hairline between them, no boxes */
.split { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); margin-top: var(--space-sm); }
.list { display: flex; flex-direction: column; border-right: 1px solid var(--rule); min-width: 0; }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px var(--space-md) 10px 0; min-width: 0; transition: background-color var(--dur) var(--ease-out); }
.row:hover { background: var(--paper-2); }
.row[aria-current="true"] { background: var(--paper-2); }
.row .t { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; font-weight: 500; }
.row .t span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .f { display: block; margin: 2px 0 0 calc(7px + var(--space-sm)); color: var(--ink-2); font-family: var(--font-mono); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--st-routine); }
.dot.attention { background: var(--st-attention); }
.dot.authorized { background: var(--st-authorized); }
.detail { padding-left: var(--space-lg); min-width: 0; }
.status { display: flex; align-items: center; gap: var(--space-sm); color: var(--ink-2); font-size: 0.8125rem; }
.detail h2 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; margin-top: var(--space-sm); overflow-wrap: anywhere; }
.detail .lead { margin-top: var(--space-sm); max-width: 68ch; }
.fields { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--space-sm) var(--space-md); margin-top: var(--space-md); font-size: 0.9375rem; }
.fields dt { color: var(--ink-2); font-size: 0.875rem; }
.fields dd { overflow-wrap: anywhere; max-width: 68ch; }
.fields dd.axes { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-2); }
.section { margin-top: var(--space-lg); }
.section h3 { font-size: 0.9375rem; font-weight: 600; }
.section .hint { color: var(--ink-2); font-size: 0.8125rem; margin-top: 2px; }
.step { display: flex; gap: var(--space-sm); align-items: baseline; flex-wrap: wrap; margin-top: var(--space-sm); }
.step span { max-width: 62ch; }
.links { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-sm); }
.links .btn { font-family: var(--font-mono); font-size: 0.8125rem; }

/* diff, timeline, evidence */
.diff { font: 12px/1.5 var(--font-mono); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; margin: var(--space-sm) 0 var(--space-md); }
.diff div { white-space: pre; padding: 0 var(--space-sm); }
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }
.block h2 { font-size: 1rem; font-weight: 600; margin-top: var(--space-lg); overflow-wrap: anywhere; }
.block h2:first-child { margin-top: var(--space-md); }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; margin-top: var(--space-sm); }
th, td { text-align: left; padding: 6px var(--space-md) 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
th { color: var(--ink-2); font-weight: 500; }
tr.pick td { background: var(--paper-2); }
.empty { color: var(--ink-2); padding: var(--space-lg) 0; max-width: 60ch; }

@media (max-width: 760px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .list { border-right: 0; border-bottom: 1px solid var(--rule); }
  .detail { padding-left: 0; padding-top: var(--space-md); }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .fields dd { margin-bottom: var(--space-sm); }
  .search { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* Journal: bounded overview and evidence disclosure, native keyboard controls. */
.journal { max-width: 920px; margin: 16px auto; overflow-wrap: anywhere; }
.journal p { margin: 8px 0; }
.journal h2 { font-size: 1.1rem; margin-top: 16px; }
.journal-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.journal select { max-width: 100%; padding: 6px; font: inherit; color: inherit; background: var(--paper); }
.journal-coverage { border-left: 3px solid var(--rule-strong); padding: 4px 12px; margin: 12px 0; }
.journal-disclosure { border-top: 1px solid var(--rule); margin: 10px 0; padding: 8px 0; }
.journal summary { cursor: pointer; }
.journal-concern, .journal-event { display: block; width: 100%; text-align: left; padding: 10px; margin: 6px 0; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 4px; }
.journal-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; }
.journal-list { max-height: 65vh; overflow: auto; }
.journal-detail { min-width: 0; }
.journal pre { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; overflow: auto; font-size: .85rem; }
.journal [aria-pressed="true"] { border: 2px solid var(--accent); }
@media (max-width: 750px) { .journal-flow { display: block; } .journal-list { max-height: 35vh; } }

.views { flex-wrap: wrap; }
.journal .search { max-width: 100%; min-width: 0; }

.journal-context { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 6px 0; }

    var q = state.query.toLowerCase();
    return data.items.filter(function (i) {
      if (state.filter !== "all" && i.bucket !== state.filter) return false;
      return !q || (i.title + " " + i.file + " " + i.summary + " " + i.observed).toLowerCase().indexOf(q) >= 0;
    });
  }
  function field(dl, label, value, cls) {
    if (!value) return;
    dl.appendChild(h("dt", "", label));
    dl.appendChild(rich(h("dd", cls || ""), value));
  }

  function detail(item) {
    var box = h("div", "detail");
    if (!item) { box.appendChild(h("div", "empty", "Select a change on the left.")); return box; }
    box.appendChild(h("div", "status", "", dot(item.bucket), h("span", "", BUCKET[item.bucket]),
                      h("span", "mono", item.kind + " · " + item.id)));
    box.appendChild(h("h2", "", item.title));
    box.appendChild(rich(h("p", "lead"), item.summary));
    var dl = h("dl", "fields");
    field(dl, "Observed", item.observed);
    field(dl, "Potential", item.potential);
    field(dl, "Unknown", item.unknown);
    field(dl, "Baseline", item.baseline);
    field(dl, "Current", item.current);
    field(dl, "Authorization", item.authorization);
    field(dl, "Context", item.context);
    field(dl, "Axes", ["difference", "focus_relation", "semantic_relation", "authorization_relation", "historical", "consequence", "attribution", "currency"]
      .map(function (k) { return k.replace("_", " ") + " " + item[k]; }).join(" · "), "axes");
    box.appendChild(dl);
    if (item.limitations.length) box.appendChild(h("p", "fine", "Limits: " + item.limitations.join("; ")));
    if (item.next.length) {
      var steps = h("div", "section");
      steps.appendChild(h("h3", "", "Possible next steps"));
      steps.appendChild(h("p", "hint", "Nothing runs from this page; the buttons copy a command."));
      item.next.forEach(function (n) {
        var row = h("div", "step", "", rich(h("span"), n));
        (n.match(/`[^`]+`/g) || []).forEach(function (c) { var cmd = c.slice(1, -1); row.appendChild(copyButton("Copy " + cmd, cmd)); });
        steps.appendChild(row);
      });
      box.appendChild(steps);
    }
    var links = h("div", "section");
    links.appendChild(h("h3", "", "Evidence"));
    var row = h("div", "links");
    item.evidence.forEach(function (id) {
      var e = byEvidence[id];
      row.appendChild(btn(id + (e ? " · " + e.source : ""), "btn", function () { state.view = "evidence"; state.sel = id; draw(); }));
    });
    if (item.diff.length) row.appendChild(btn("Open diff", "btn", function () { state.view = "diff"; draw(); }));
    if (!item.evidence.length && !item.diff.length) row.appendChild(h("span", "mute", "No linked records."));
    links.appendChild(row);
    box.appendChild(links);
    return box;
  }

  function review() {
    var list = visible(), wrap = h("div", "split"), col = h("div", "list");
    if (!list.length) {
      col.appendChild(h("div", "empty", "Nothing in this filter. That is not evidence that nothing changed: see the coverage limits above."));
    }
    var shown = data.items.filter(function (i) { return i.id === state.sel; })[0];
    if (!shown || list.indexOf(shown) < 0) shown = list[0];
    list.forEach(function (i) {
      var b = btn("", "row", function () { state.sel = i.id; renderBody(); });
      if (shown && shown.id === i.id) attr(b, "aria-current", "true");
      b.appendChild(h("span", "t", "", dot(i.bucket), h("span", "", i.title)));
      b.appendChild(h("span", "f", i.file));
      attr(b, "title", i.title);
      col.appendChild(b);
    });
    wrap.appendChild(col);
    wrap.appendChild(detail(shown));
    return wrap;
  }
  function diffs() {
    var box = h("div", "block"), any = false;
    data.items.forEach(function (i) {
      if (!i.diff.length) return;
      any = true;
      box.appendChild(h("h2", "", i.title));
      box.appendChild(h("div", "sub", i.baseline));
      var d = h("div", "diff");
      i.diff.forEach(function (l) { d.appendChild(h("div", l[0], l[1])); });
      box.appendChild(d);
    });
    if (!any) box.appendChild(h("div", "empty", "No line diffs: no baseline was kept, or nothing changed. Diffs are bounded, and secret-like strings are redacted."));
    return box;
  }
  function table(head, rows, pick) {
    var t = h("table"), tr = h("tr");
    head.forEach(function (x) { tr.appendChild(h("th", "", x)); });
    t.appendChild(tr);
    rows.forEach(function (r) {
      var row = h("tr", pick && pick === r[0] ? "pick" : "");
      r.forEach(function (c) { row.appendChild(h("td", "", c)); });
      t.appendChild(row);
    });
    return t;
  }
  function timeline() {
    if (!data.timeline.length) return h("div", "empty", "No events were recorded.");
    return h("div", "block", "", h("p", "fine", "Order is not causation, consent or authorship."),
             table(["When", "Kind", "Event"], data.timeline.map(function (e) { return [e.when, e.kind, e.text]; })));
  }
  function evidence() {
    return h("div", "block", "", table(["Id", "Source", "Reference", "Detail"],
      data.evidence.map(function (e) { return [e.id, e.source, e.ref, e.detail]; }), state.sel));
  }

  function header() {
    var b = data.baselines, c = data.coverage, frag = h("div");
    var tools = h("div", "tools");
    tools.appendChild(copyButton("Copy review brief", data.brief_md || ""));
    tools.appendChild(btn("Light / dark", "btn", function () {
      var r = document.documentElement;
      var dark = r.dataset.theme ? r.dataset.theme === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      r.dataset.theme = dark ? "light" : "dark";
    }));
    frag.appendChild(h("div", "head", "", h("div", "", "", h("h1", "title", data.analysis_path),
                                            h("p", "sub", "Track changes · snapshot " + data.generated_at)), tools));
    var meta = h("dl", "meta");
    [["Objective", (data.objective.text || "not stated") + (data.objective.source ? " (" + data.objective.source + ")" : ""), true],
     [b.original_selection === "earliest_available_for_display" ? "Comparison start (earliest available)" : "Original plan", b.original_plan || "none"], ["Current plan", b.current_plan || "none"],
     ["Focus", data.focus.active_at_snapshot ? "open" : "none"]].forEach(function (p) {
      var cell = h("div", p[2] ? "wide" : "");
      cell.appendChild(h("dt", "", p[0]));
      cell.appendChild(h("dd", p[0].indexOf("plan") >= 0 ? "mono" : "", p[1]));
      meta.appendChild(cell);
    });
    frag.appendChild(meta);
    frag.appendChild(h("p", "fine", "Read-only evidence. It does not approve, freeze, run or validate anything. Not observed: " + c.not_observed.join(", ") + "."));
    if (c.limitations.length) {
      var d = h("details", "limits"), ul = h("ul");
      d.appendChild(h("summary", "", "Coverage limits (" + c.limitations.length + ")"));
      c.limitations.forEach(function (l) { ul.appendChild(h("li", "", l)); });
      d.appendChild(ul);
      frag.appendChild(d);
    }
    return frag;
  }

  // Journal navigation is presentation state only; no browser storage or network.
var journalState = {overview: true, query: "", period: "default", selected: null,
                    limit: 30, routine: false, expanded: true, listScroll: 0, mode: "history", concern: null};
function journal() {
  var j = data.journal, s = journalState, all = j.events;
  var box = h("main", "journal");
  function disclosure(title, child) {
    return h("details", "journal-disclosure", "", h("summary", "", title), child);
  }
  function para(label, value) { return h("p", "", label + ": " + (value || "not recorded")); }
  var last = j.checkpoints[j.checkpoints.length - 1];
  var sessions = all.filter(function (e) { return e.kind === "focus"; });
  var latestSession = sessions[sessions.length - 1];
  var baseline = last ? "Since checkpoint saved " + last.saved_at : latestSession ?
    "Latest recorded session, started " + latestSession.occurred_at : "Available history (no saved checkpoint or session)";
  function periodEvents() {
    if (s.period === "all") return all;
    if (last) return all.filter(function (e) { return last.event_ids.indexOf(e.id) < 0; });
    if (latestSession) return all.filter(function (e) {
      return !e.occurred_at || e.occurred_at >= latestSession.occurred_at;
    });
    return all;
  }
  function concern(e) {
    if (e.limitations.some(function (l) { return l.indexOf("Conflicting") >= 0; })) return "Conflicting or changed source copies";
    if (e.kind === "launch") return "Missing completion evidence";
    if (e.kind === "attempt") {
      if (e.detail.submission) return "Submission without recorded job completion";
      if (e.detail.exit_status !== 0) return e.summary === "failed attempt" ? "Failed attempts remain in history" : "Unknown attempt completion";
      if (e.detail.launch_match !== "matched") return "Launch attribution gaps";
    }
    return null;
  }
  var scope = periodEvents(), groups = {};
  scope.forEach(function (e) {
    var title = concern(e);
    if (title) (groups[title] || (groups[title] = [])).push(e);
    if (e.kind === "verification") {
      (e.detail.projection.findings || []).forEach(function (f) {
        if (f[0] === "gap" || f[0] === "block") {
          var key = f[0] + ": " + f[1];
          var found = groups[key] || (groups[key] = []);
          if (!found.some(function (other) { return other.id === e.id; })) found.push(e);
        }
      });
    }
  });
  var concerns = Object.keys(groups).sort(function (a, b) {
    function rank(t) { return t.indexOf("block:") === 0 ? 0 : /Conflicting|completion|Submission/.test(t) ? 1 : 2; }
    return rank(a) - rank(b) || a.localeCompare(b);
  });
  var serious = Object.keys(j.coverage).filter(function (k) {
    return ["partial", "absent", "malformed", "interrupted", "unsupported"].indexOf(j.coverage[k]) >= 0;
  });
  // Critical source and completion gaps stay visible even when the chosen period has no events.
  var conflicts = all.filter(function (e) { return e.limitations.some(function (l) { return l.indexOf("Conflicting") >= 0; }); }).length;
  var incomplete = all.filter(function (e) { return e.kind === "launch" || e.detail.submission; }).length;
  box.appendChild(h("h1", "title", j.analysis_path.split("/").pop()));
  box.appendChild(h("p", "lead", j.objective.text || "Recorded objective not available"));
  var periodLabel = s.period === "all" ? "All available history" : baseline;
  box.appendChild(h("p", "sub journal-context", periodLabel + " · Report generated " + data.generated_at));
  var controls = h("div", "journal-controls");
  var select = h("select");
  attr(select, "aria-label", "Historical period");
  [["default", baseline], ["all", "All available history"]].forEach(function (v) {
    var option = h("option", "", v[1]); option.value = v[0]; select.appendChild(option);
  });
  select.value = s.period;
  select.addEventListener("change", function () { s.period = select.value; s.limit = 30; renderBody(); });
  controls.appendChild(select);
  box.appendChild(controls);
  var coverage = h("div", "journal-coverage");
  coverage.appendChild(h("p", "", "Coverage: " + (serious.length ? serious.length + " source group(s) absent or incomplete" :
    "inspected sources available; history completeness not established") +
    (conflicts ? " · " + conflicts + " record(s) have conflicting or changed variants" : "") + (j.coverage.handoffs === "interrupted" ? " · publication interrupted" : "") + " · " + incomplete + " record(s) without their own completion evidence · Context is a saved snapshot; refresh to inspect later changes."));
  var covDetail = h("div");
  covDetail.appendChild(para("Refreshed", j.refreshed_at));
  Object.keys(j.coverage).sort().forEach(function (k) { covDetail.appendChild(para(k, j.coverage[k])); });
  covDetail.appendChild(para("Loaded records", all.length + "; collection omissions " + j.collection.omitted));
  j.limitations.forEach(function (l) { covDetail.appendChild(h("p", "", l)); });
  j.checkpoints.forEach(function (c) {
    covDetail.appendChild(disclosure("Coverage observed at checkpoint " + c.saved_at,
      h("pre", "", JSON.stringify(c.source_coverage, null, 2))));
  });
  coverage.appendChild(disclosure("Inspect source coverage and freshness", covDetail));
  box.appendChild(coverage);
  if (s.overview) {
    var verification = all.filter(function (e) { return e.kind === "verification"; }).sort(function (a, b) {
      return (a.observed_at || "").localeCompare(b.observed_at || "");
    });
    var latest = verification[verification.length - 1], projection = latest && latest.detail.projection;
    var tied = latest ? verification.filter(function (e) { return e.observed_at === latest.observed_at; }) : [];
    function outcomes(key) {
      return Array.from(new Set(tied.map(function (e) {
        var p = e.detail.projection; return key === "qualification" ? (p.qualification || {}).overall || "not available" : p.conformity;
      }))).join("; ");
    }
    var assessment = latest ? " · saved observation " + (latest.observed_at || "time not recorded") : "";
    box.appendChild(para("Latest recorded conformity", projection ? outcomes("conformity") + assessment : "not available"));
    box.appendChild(para("Latest recorded qualification", projection && projection.qualification ?
      outcomes("qualification") + assessment : "not available"));
    if (tied.length > 1) box.appendChild(h("p", "fine", latest.observed_at ? "Multiple saved observations share this time; their order is not established." : "Multiple saved observations have no recorded observation time; their order is not established."));
    if (latest) box.appendChild(h("p", "fine", "Assessment computation time was not separately recorded. Saved time is not output production time."));
    var priorities = h("div", "journal-priorities");
    priorities.appendChild(h("h2", "", "Priority concerns"));
    if (!concerns.length) priorities.appendChild(h("p", "", "No priority concerns found in the inspected records"));
    concerns.slice(0, 3).forEach(function (title) {
      var es = groups[title];
      var label = title.replace(/[0-9a-f]{16,}/g, "[identifier in evidence]");
      if (label.length > 110) label = label.slice(0, 107) + "…";
      var b = btn(label + " · " + es.length + " observation(s). Inspect the recorded evidence.", "journal-concern", function () {
        s.selected = es[0].id; s.concern = title; s.mode = "concerns"; s.overview = false; s.expanded = true; renderBody();
      });
      priorities.appendChild(b);
    });
    box.appendChild(priorities);
    box.appendChild(btn("Show all " + concerns.length + " concerns", "btn", function () {
      s.overview = false; s.mode = "concerns"; s.routine = false; renderBody();
    }));
    box.appendChild(btn("Explore history · " + scope.length + " records", "btn", function () {
      s.overview = false; s.mode = "history"; renderBody();
    }));
    box.appendChild(h("p", "fine", "Routine records are collapsed. Search and JSON export include all " + all.length + " loaded records."));
    return box;
  }
  box.appendChild(btn("Back to overview", "btn", function () { s.overview = true; renderBody(); }));
  var expandControl = btn(s.expanded ? "Collapse detail" : "Expand detail", "btn", function () {
    s.expanded = !s.expanded; renderBody();
  });
  attr(expandControl, "aria-expanded", String(s.expanded)); box.appendChild(expandControl);
  var search = h("input", "search"); search.type = "search"; search.value = s.query;
  attr(search, "aria-label", "Search all loaded journal records, including collapsed history");
  search.placeholder = "Search all loaded history";
  // Only redraw results, keeping the focused search input in place.
  box.appendChild(search);
  var resultMount = h("div"); box.appendChild(resultMount);
  function results() {
    clear(resultMount);
    var q = s.query.toLowerCase();
    var filtered = (q ? all : scope).filter(function (e) { return !q || JSON.stringify(e).toLowerCase().indexOf(q) >= 0; });
    var routineCount = filtered.filter(function (e) { return !concern(e) && e.kind !== "verification"; }).length;
    var routineControl = btn((s.routine ? "Collapse" : "Show") + " routine records (" + routineCount + ")", "btn", function () {
      s.routine = !s.routine; s.mode = "history"; results();
    });
    attr(routineControl, "aria-expanded", String(s.routine)); resultMount.appendChild(routineControl);
    var visible = filtered.filter(function (e) { return q || s.routine || concern(e) || e.kind === "verification" || e.id === s.selected; });
    resultMount.appendChild(h("p", "fine", (q ? "Search covers all loaded periods. " : "") +
      "Showing " + Math.min(s.limit, visible.length) + " of " + visible.length + " matching records; " +
      (filtered.length - visible.length) + " routine records collapsed; " + j.collection.omitted + " collection omissions."));
    var flow = h("div", "journal-flow"), list = h("div", "journal-list");
    attr(list, "aria-label", "Historical records");
    if (!q && s.mode === "concerns") {
      resultMount.appendChild(h("p", "fine", "All " + concerns.length + " distinct concern(s); repeated observations grouped."));
      concerns.forEach(function (title) {
        var b = btn(title + " · " + groups[title].length + " observation(s)", "journal-concern", function () {
          s.selected = groups[title][0].id; s.concern = title; s.expanded = true; results();
        });
        list.appendChild(b);
      });
    }
    (q || s.mode !== "concerns" ? visible.slice(0, s.limit) : []).forEach(function (e) {
      var b = btn(e.summary + " · " + (e.occurred_at || "occurrence time unknown"), "journal-event", function () {
        s.listScroll = list.scrollTop || 0; s.selected = e.id; s.concern = null; s.expanded = true; results();
      });
      attr(b, "aria-pressed", s.selected === e.id ? "true" : "false"); list.appendChild(b);
    });
    if ((q || s.mode !== "concerns") && visible.length > s.limit) list.appendChild(btn("Show next " + Math.min(30, visible.length - s.limit) + " records", "btn", function () {
      s.listScroll = list.scrollTop || 0; s.limit += 30; results();
    }));
    list.addEventListener("scroll", function () { s.listScroll = list.scrollTop; });
    flow.appendChild(list);
    var selected = all.filter(function (e) { return e.id === s.selected; })[0];
    var detailBox = h("section", "journal-detail");
    attr(detailBox, "aria-label", "Selected record");
    if (!selected) detailBox.appendChild(h("p", "", "Select a concern or event to inspect its evidence."));
    else if (!s.expanded) detailBox.appendChild(h("p", "", selected.summary + " · detail collapsed"));
    else {
      var e = selected;
      detailBox.appendChild(h("h2", "", e.summary));
      detailBox.appendChild(para("Observation", s.concern || e.summary));
      detailBox.appendChild(para("Recorded outcome", e.kind === "verification" ? e.detail.projection.conformity :
        e.detail.submission ? "submission; completion unknown" : e.detail.exit_status === undefined ? "see recorded evidence" : String(e.detail.exit_status)));
      detailBox.appendChild(para("Context", e.references.plan ? "Recorded plan " + e.references.plan : (e.references.plans || []).length > 1 ? "Multiple recorded plans; see evidence" : "Plan attribution not established"));
      if (e.references.attempt) detailBox.appendChild(para("Attempt", String(e.references.attempt).slice(0, 8) + " (full reference in evidence)"));
      if (e.references.instance) detailBox.appendChild(para("Approval instance", String(e.references.instance).slice(0, 8) + " (full reference in evidence)"));
      var checkpoint = j.checkpoints.find(function (c) { return (e.sources || []).indexOf(c.path) >= 0; });
      if (checkpoint) detailBox.appendChild(para("Preserved observation", "Checkpoint saved " + checkpoint.saved_at));
      detailBox.appendChild(para("Source availability", e.original_evidence));
      detailBox.appendChild(para("Potential implication", "This record may limit what can be established from the evidence; scientific impact is not assessed."));
      detailBox.appendChild(para("Unknowns", e.unknown));
      detailBox.appendChild(h("p", "fine", "Primary inspection: open Evidence and provenance below."));
      if (s.concern && groups[s.concern] && groups[s.concern].length > 1) {
        var related = h("div");
        groups[s.concern].forEach(function (other) {
          related.appendChild(btn(other.summary + " · " + (other.occurred_at || "occurrence time unknown"), "btn", function () {
            s.selected = other.id; results();
          }));
        });
        detailBox.appendChild(disclosure("Related observations and variants (" + groups[s.concern].length + ")", related));
      }
      var evidenceBox = h("div");
      evidenceBox.appendChild(para("Occurrence", e.occurred_at));
      evidenceBox.appendChild(para("Time basis", e.timestamp_basis));
      evidenceBox.appendChild(para("Earliest available saved observation", e.observed_at));
      evidenceBox.appendChild(para("Original evidence", e.original_evidence));
      (e.sources || []).forEach(function (p) {
        evidenceBox.appendChild(para("Source (repository relative; copy to inspect)", p));
        evidenceBox.appendChild(copyButton("Copy source path", p, "btn"));
      });
      evidenceBox.appendChild(h("pre", "", JSON.stringify(e.detail, null, 2)));
      detailBox.appendChild(disclosure("Evidence and provenance (" + (e.sources || []).length + " references)", evidenceBox));
      var limitationBox = h("div");
      e.limitations.concat(j.limitations).forEach(function (l) { limitationBox.appendChild(h("p", "", l)); });
      detailBox.appendChild(disclosure("Coverage limitations (" + (e.limitations.length + j.limitations.length) + ")", limitationBox));
      detailBox.appendChild(disclosure("Technical metadata (identities and independent axes)", h("pre", "", JSON.stringify({
        id: e.id, source_identity: e.source_identity, source_digest: e.source_digest, references: e.references,
        attribution: e.attribution, difference: e.difference, authorization: e.authorization_relation
      }, null, 2))));
      if (j.note_observations.length) {
        var noteBox = h("div");
        j.note_observations.forEach(function (n) { noteBox.appendChild(para("Researcher note (reference only)",
          n.reference + " · " + n.current_status + (n.changed ? " · changed since saved reference" : ""))); });
        detailBox.appendChild(disclosure("Note references (" + j.note_observations.length + ")", noteBox));
      }
    }
    flow.appendChild(detailBox); resultMount.appendChild(flow); list.scrollTop = s.listScroll;
  }
  search.addEventListener("input", function () { s.query = search.value; s.limit = 30; results(); });
  results();
  return box;
}

  var VIEWS = [["review", "Review", function () { return data.items.length; }],
               ["diff", "Diff", function () { return data.items.filter(function (i) { return i.diff.length; }).length; }],
               [data.journal ? "journal" : "timeline", data.journal ? "Journal" : "Timeline", function () { return data.journal ? data.journal.events.length : data.timeline.length; }],
               ["evidence", "Evidence", function () { return data.evidence.length; }]];

  // level 1: the four views
  function views() {
    var bar = attr(h("div", "views"), "role", "tablist");
    VIEWS.forEach(function (v) {
      var t = h("button", "view", v[1], h("span", "n", v[2]()));
      t.type = "button";
      attr(t, "role", "tab"); attr(t, "aria-selected", state.view === v[0] ? "true" : "false");
      t.addEventListener("click", function () { state.view = v[0]; draw(); });
      bar.appendChild(t);
    });
    return bar;
  }
  // level 2: filters of the Review view, drawn directly under the view strip, only for Review
  function filters() {
    var bar = h("div", "filters"), seg = attr(h("div", "seg"), "role", "group");
    attr(seg, "aria-label", "Filter changes");
    [["attention", "Needs attention", data.counts.attention], ["all", "All", data.items.length],
     ["authorized", "Authorized", data.counts.authorized], ["routine", "Routine", data.counts.routine]].forEach(function (f) {
      var c = h("button", "chip", f[1], h("span", "n", f[2]));
      c.type = "button"; attr(c, "aria-pressed", state.filter === f[0] ? "true" : "false");
      c.addEventListener("click", function () { state.filter = f[0]; draw(); });
      seg.appendChild(c);
    });
    var q = h("input", "search"); q.type = "search"; q.placeholder = "Search changes"; q.value = state.query;
    attr(q, "aria-label", "Search changes");
    q.addEventListener("input", function () { state.query = q.value; renderBody(); });  // only the body redraws, so typing keeps focus
    bar.appendChild(seg); bar.appendChild(q);
    return bar;
  }

  var mount = h("div");
  function renderBody() {
    clear(mount);
    mount.appendChild({review: review, diff: diffs, timeline: timeline, journal: journal, evidence: evidence}[state.view]());
  }
  function draw() {
    clear(app);
    document.title = "Track changes · " + data.analysis_path;
    if (state.view !== "journal") app.appendChild(header());
    app.appendChild(views());
    if (state.view === "review") app.appendChild(filters());
    app.appendChild(mount);
    renderBody();
  }
  draw();
})();
</script></body></html>
