<style>/* Tokens come from DESIGN.md at the repo root (cool paper, one teal accent); tests/test_design_tokens.py keeps
   them equal. Hallmark · component: report viewer · genre: modern-minimal.
   Offline file: system fonts only, a CSP forbids loading any other. */
:root {
  --paper: #f9fbfd;
  --paper-2: #edf1f4;
  --ink: #111921;
  --ink-2: #4d5660;
  --rule: #d9dfe3;
  --rule-strong: #bbc2c7;
  --accent: #00696f;
  --focus: var(--accent);
  --pass: #277a55;
  --stale: #b46d10;
  --gap: #914a8c;
  --fail: #b2392b;
  --routine: #81878c;
  --st-attention: var(--stale);
  --st-authorized: var(--pass);
  --st-routine: var(--routine);
  --add: #daf9e7;
  --del: #ffe8e4;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 40px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 120ms;
}
:root[data-theme="dark"] {
  --paper: #0e1216;
  --paper-2: #161b20;
  --ink: #e3e9ed;
  --ink-2: #9ea6ab;
  --rule: #292f34;
  --rule-strong: #42494f;
  --accent: #64c3c8;
  --pass: #75c59b;
  --stale: #efb062;
  --gap: #d997d2;
  --fail: #f28979;
  --routine: #81878c;
  --add: #0e3020;
  --del: #3e1e1c;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1216;
    --paper-2: #161b20;
    --ink: #e3e9ed;
    --ink-2: #9ea6ab;
    --rule: #292f34;
    --rule-strong: #42494f;
    --accent: #64c3c8;
    --pass: #75c59b;
    --stale: #efb062;
    --gap: #d997d2;
    --fail: #f28979;
    --routine: #81878c;
    --add: #0e3020;
    --del: #3e1e1c;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
#app { overflow-wrap: anywhere; max-width: 1080px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }
h1, h2, h3, p, dl, dd { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* Inside a scrolling strip or list the ring would be clipped at the edge, so it is drawn inward. */
.view:focus-visible, .journal-list :focus-visible { outline-offset: -2px; }
.mono, code { font-family: var(--font-mono); font-size: 0.9em; }
code { background: var(--paper-2); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.mute { color: var(--ink-2); }

/* page header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-md); flex-wrap: wrap; }
.title { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; min-width: 0; }
.sub { color: var(--ink-2); font-size: 0.875rem; margin-top: var(--space-xs); }
.tools { display: flex; gap: var(--space-sm); }
.btn { background: transparent; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 12px; font-size: 0.875rem; line-height: 1.4; white-space: nowrap; transition: background-color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out); }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn[data-state="done"] { border-color: var(--st-authorized); color: var(--st-authorized); }
.btn[data-state="failed"] { border-color: var(--fail); color: var(--fail); }
.btn:disabled { opacity: 0.5; cursor: default; }

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm) var(--space-lg); margin-top: var(--space-md); font-size: 0.875rem; }
.meta .wide { grid-column: 1 / -1; }
.meta dt { color: var(--ink-2); font-size: 0.8125rem; }
.meta dd { overflow-wrap: anywhere; }
.fine { margin-top: var(--space-md); color: var(--ink-2); font-size: 0.8125rem; max-width: 72ch; }
details.limits { margin-top: var(--space-sm); font-size: 0.8125rem; color: var(--ink-2); }
details.limits summary { cursor: pointer; width: fit-content; }
details.limits ul { margin: var(--space-sm) 0 0; padding-left: 1.1em; max-width: 72ch; }

/* level 1: views */
.views { display: flex; gap: var(--space-lg); margin-top: var(--space-lg); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.view { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 0; color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: color var(--dur) var(--ease-out); }
.view:hover { color: var(--ink); }
.view[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.view .n { margin-left: 6px; color: var(--ink-2); font-weight: 400; font-variant-numeric: tabular-nums; }

/* level 2: filters inside the Review view, directly under the view strip */
.filters { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); flex-wrap: wrap; padding: var(--space-md) 0 var(--space-sm); }
.seg { display: flex; gap: var(--space-xs); flex-wrap: wrap; }
.chip { background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 10px; color: var(--ink-2); font-size: 0.875rem; white-space: nowrap; transition: background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out); }
.chip:hover { background: var(--paper-2); color: var(--ink); }
.chip:active { transform: translateY(1px); }
.chip[aria-pressed="true"] { background: var(--paper-2); border-color: var(--rule-strong); color: var(--ink); }
.chip .n { margin-left: 4px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.search { background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 10px; font-size: 0.875rem; width: 240px; max-width: 100%; }
.search::placeholder { color: var(--ink-2); }

/* list and detail: one hairline between them, no boxes */
.split { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); margin-top: var(--space-sm); }
.list { display: flex; flex-direction: column; border-right: 1px solid var(--rule); min-width: 0; }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px var(--space-md) 10px 0; min-width: 0; transition: background-color var(--dur) var(--ease-out); }
.row:hover { background: var(--paper-2); }
.row[aria-current="true"] { background: var(--paper-2); }
.row .t { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; font-weight: 500; }
.row .t .ttl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .f { display: block; margin: 2px 0 0; color: var(--ink-2); font-family: var(--font-mono); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail { padding-left: var(--space-lg); min-width: 0; }
.status { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-sm); color: var(--ink-2); font-size: 0.8125rem; }
.detail h2 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; margin-top: var(--space-sm); overflow-wrap: anywhere; }
.detail .lead { margin-top: var(--space-sm); max-width: 68ch; }
.fields { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--space-sm) var(--space-md); margin-top: var(--space-md); font-size: 0.9375rem; }
.fields dt { color: var(--ink-2); font-size: 0.875rem; }
.fields dd { overflow-wrap: anywhere; max-width: 68ch; }
.fields dd.path { font-family: var(--font-mono); font-size: 0.8125rem; }
.fields dd.axes { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-2); }
.section { margin-top: var(--space-lg); }
.section h3 { font-size: 0.9375rem; font-weight: 600; }
.section .hint { color: var(--ink-2); font-size: 0.8125rem; margin-top: 2px; }
.step { display: flex; gap: var(--space-sm); align-items: baseline; flex-wrap: wrap; margin-top: var(--space-sm); }
.step span { max-width: 62ch; }
.links { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-sm); }
.links .btn { font-family: var(--font-mono); font-size: 0.8125rem; }
.links .btn, .step .btn { white-space: normal; text-align: left; }

/* diff, timeline, evidence */
.diff { font: 12px/1.5 var(--font-mono); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; margin: var(--space-sm) 0 var(--space-md); }
.diff div { white-space: pre; padding: 0 var(--space-sm); }
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }
.block h2 { font-size: 1rem; font-weight: 600; margin-top: var(--space-lg); overflow-wrap: anywhere; }
.block h2:first-child { margin-top: var(--space-md); }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; margin-top: var(--space-sm); }
th, td { text-align: left; padding: 6px var(--space-md) 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
th { color: var(--ink-2); font-weight: 500; }
tr.pick td { background: var(--paper-2); }
.empty { color: var(--ink-2); padding: var(--space-lg) 0; max-width: 60ch; }

/* Plan walkthrough: the steps in order, with the recorded command and output. Text only; nothing runs. */
.wrow { border-top: 1px solid var(--rule); padding: var(--space-md) 0; }
.wrow:first-of-type { border-top: 0; }
.whead { display: flex; gap: var(--space-sm); align-items: baseline; flex-wrap: wrap; }
.wid { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-2); flex: none; }
.wstep { font-weight: 500; overflow-wrap: anywhere; }
.wchoice, .wclaim { margin-top: var(--space-xs); max-width: 68ch; }
.wcmd { display: flex; gap: var(--space-sm); align-items: baseline; flex-wrap: wrap; margin-top: var(--space-sm); }
.wcmd code { font-family: var(--font-mono); font-size: 0.8125rem; overflow-wrap: anywhere; }
.btn.small { padding: 2px 8px; font-size: 0.75rem; }
pre.wout { font: 12px/1.5 var(--font-mono); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 6px; padding: var(--space-sm); margin: var(--space-xs) 0 0; overflow-x: auto; white-space: pre; max-width: 100%; }

@media (max-width: 760px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .list { border-right: 0; border-bottom: 1px solid var(--rule); }
  .detail { padding-left: 0; padding-top: var(--space-md); }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .fields dd { margin-bottom: var(--space-sm); }
  .search { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* Journal: bounded overview and evidence disclosure, native keyboard controls. */
.journal { max-width: 920px; margin: 16px auto; overflow-wrap: anywhere; }
.journal p { margin: 8px 0; }
.journal h2 { font-size: 1.1rem; margin-top: 16px; }
.journal-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.journal select { max-width: 100%; padding: 6px; font: inherit; color: inherit; background: var(--paper); }
.journal-coverage { border-left: 3px solid var(--rule-strong); padding: 4px 12px; margin: 12px 0; }
.journal-disclosure { border-top: 1px solid var(--rule); margin: 10px 0; padding: 8px 0; }
.journal summary { cursor: pointer; }
.journal-concern, .journal-event { display: block; width: 100%; text-align: left; padding: 10px; margin: 6px 0; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 4px; }
.journal-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; }
.journal-list { max-height: 65vh; overflow: auto; }
.journal-detail { min-width: 0; }
.journal pre { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; overflow: auto; font-size: .85rem; }
.journal [aria-pressed="true"] { border: 2px solid var(--accent); }
@media (max-width: 750px) { .journal-flow { display: block; } .journal-list { max-height: 35vh; } }

.views { flex-wrap: wrap; }
.journal .search { max-width: 100%; min-width: 0; }

.journal-context { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 6px 0; }
/* Status pill (DESIGN.md components.status-pill): the word always shows; colour only tints it. */
.pill { flex: none; display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; color: var(--ink); background: color-mix(in srgb, var(--st, var(--routine)) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st, var(--routine)) 55%, transparent); }
.pill.pass { --st: var(--pass); }
.pill.stale { --st: var(--stale); }
.pill.gap { --st: var(--gap); }
.pill.fail { --st: var(--fail); }
.pill.routine { --st: var(--routine); }

    q.addEventListener("input", function () { state.query = q.value; renderBody(); });  // only the body redraws, so typing keeps focus
    bar.appendChild(seg); bar.appendChild(q);
    return bar;
  }

  var mount = h("div");
  function renderBody() {
    clear(mount);
    mount.appendChild({review: review, diff: diffs, walk: walk, timeline: timeline, journal: journal, evidence: evidence}[state.view]());
  }
  function draw() {
    clear(app);
    document.title = "Track changes · " + data.analysis_path;
    if (state.view !== "journal") app.appendChild(header());
    app.appendChild(views());
    if (state.view === "review") app.appendChild(filters());
    app.appendChild(mount);
    renderBody();
  }
  draw();
})();
</script></body></html>
