<svg xmlns="http://www.w3.org/2000/svg" width="480" height="471" viewBox="0 0 480 471" role="img" aria-labelledby="title desc">
<title id="title">Three acts in the full analysis workflow</title>
<desc id="desc">Plan and approve scientific intent, implement and review before freezing code for the reportable run, then verify evidence and retain provenance and a handoff. The detailed workflow below includes optional branches.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="471" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="20" y="12" width="440" height="122" rx="8"/>
<text x="240" y="44" class="on-accent head">1. Plan and approve intent</text>
<text class="on-accent" x="240" y="75">Question, sourced choices and</text>
<text class="on-accent" x="240" y="104">inputs</text>
<path class="arrow" d="M240 138v16"/>
<rect class="human" x="20" y="160" width="440" height="151" rx="8"/>
<text x="240" y="192" class="head">2. Implement, review</text>
<text x="240" y="221" class="head">and freeze</text>
<text x="240" y="252">Then run the covered reportable</text>
<text x="240" y="281">work</text>
<path class="arrow" d="M240 315v16"/>
<rect class="box" x="20" y="337" width="440" height="122" rx="8"/>
<text x="240" y="369" class="head">3. Verify and retain the record</text>
<text x="240" y="400">Read gaps; save provenance and</text>
<text x="240" y="429">hand off</text>
</g></svg>
