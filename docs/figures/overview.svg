<svg xmlns="http://www.w3.org/2000/svg" width="480" height="474" viewBox="0 0 480 474" role="img" aria-labelledby="title desc">
<title id="title">The method from question to recorded evidence</title>
<desc id="desc">A researcher states a question, an agent proposes a sourced plan, the researcher approves, covered work leaves records, and verification compares the records with the plan.</desc>
<defs><style>svg{--paper:#fff;--ink:#263238;--record:#f1f6f8;--record-edge:#527b8b;--human:#f5f1f7;--human-edge:#786389;--gap:#fcf8ee;--gap-edge:#9c7e34;--arrow:#626b70}
@media(prefers-color-scheme:dark){svg{--paper:#18222a;--ink:#e8edf0;--record:#253a45;--record-edge:#8dbbc9;--human:#352c40;--human-edge:#b9a3c9;--gap:#3b3324;--gap-edge:#d4b263;--arrow:#c2ccd2}}
text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.box{fill:var(--record);stroke:var(--record-edge);stroke-width:2}.human{fill:var(--human);stroke:var(--human-edge)}.gap{fill:var(--gap);stroke:var(--gap-edge);stroke-dasharray:6 4}.arrow{stroke:var(--arrow);stroke-width:2;fill:none;marker-end:url(#tip)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="var(--arrow)"/></marker></defs>
<rect width="480" height="474" rx="12" fill="var(--paper)"/>
<g text-anchor="middle">
<rect class="box human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">State the question</text>
<text x="240" y="75">In your own words</text>
<path class="arrow" d="M240 109v16"/>
<rect class="box human" x="20" y="131" width="440" height="93" rx="8"/>
<text x="240" y="163" class="head">Read and approve the plan</text>
<text x="240" y="194">Inspect choices and their sources</text>
<path class="arrow" d="M240 228v16"/>
<rect class="box" x="20" y="250" width="440" height="93" rx="8"/>
<text x="240" y="282" class="head">Run the covered work</text>
<text x="240" y="313">Keep the recorded outcomes</text>
<path class="arrow" d="M240 347v16"/>
<rect class="box" x="20" y="369" width="440" height="93" rx="8"/>
<text x="240" y="401" class="head">Check the record</text>
<text x="240" y="432">Keep failures and gaps visible</text>
</g></svg>
