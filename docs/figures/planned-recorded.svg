<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
  <title id="title">Planning and observation are independent questions</title>
  <desc id="desc">For a planned recorded step, inspect outcome and attribution. A planned step without a record is an evidence gap, not proof it never ran. For an unplanned recorded run, inspect approval and context. No observed event can be placed in the unplanned unrecorded cell.</desc>
  <defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:23px}.head{font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style></defs>
  <rect class="bg" width="480" height="390" rx="12"/>
  <g text-anchor="middle">
    <text class="head" x="193" y="35">Recorded</text><text class="head" x="380" y="35">Not recorded</text>
    <text class="head" x="51" y="133" style="font-size:21px">Planned</text>
    <text class="head" x="51" y="287" style="font-size:21px">Not</text><text class="head" x="51" y="314" style="font-size:21px">planned</text>
    <rect class="focal" x="106" y="57" width="174" height="146" rx="8"/><text class="on-accent" x="193" y="105">Inspect</text><text class="on-accent" x="193" y="135">outcome and</text><text class="on-accent" x="193" y="165">attribution</text>
    <rect class="gap" x="293" y="57" width="174" height="146" rx="8"/><text x="380" y="105">Evidence gap</text><text x="380" y="135">Occurrence</text><text x="380" y="165">unknown</text>
    <rect class="box" x="106" y="226" width="174" height="146" rx="8"/><text x="193" y="274">Inspect</text><text x="193" y="304">approval</text><text x="193" y="334">and context</text>
    <rect class="gap" x="293" y="226" width="174" height="146" rx="8"/><text x="380" y="274">No observed</text><text x="380" y="304">event to</text><text x="380" y="334">place here</text>
  </g>
</svg>
