<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
<title id="title">Sample rows are not necessarily independent donors</title>
<desc id="desc">An illustrative donor A has one aliquot; donor B has two aliquots at the same visit. These are teaching tokens, not cohort counts. Duplicate rows contradict an assumption that each donor appears only once.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="390" rx="12"/>
<g text-anchor="middle">
<rect class="box" x="20" y="20" width="440" height="130" rx="8"/>
<text class="head" x="240" y="57">Donor A · one visit</text>
<circle class="dot" cx="240" cy="104" r="22"/><text x="330" y="112">one aliquot</text>
<rect class="focal" x="20" y="178" width="440" height="145" rx="8"/>
<text class="on-accent head" x="240" y="215">Donor B · one visit</text>
<circle class="dot on-accent" cx="105" cy="264" r="22"/><circle class="dot on-accent" cx="175" cy="264" r="22"/><text class="on-accent" x="320" y="272">two aliquots</text>
<text x="240" y="365">Illustrative tokens, not cohort counts</text>
</g></svg>
