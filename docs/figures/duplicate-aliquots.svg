<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
<title id="title">Sample rows are not necessarily independent donors</title>
<desc id="desc">An illustrative donor A has one aliquot; donor B has two aliquots at the same visit. These are teaching tokens, not cohort counts. Duplicate rows contradict an assumption that each donor appears only once.</desc>
<defs><style>svg{--paper:#fff;--ink:#263238;--record:#f1f6f8;--record-edge:#527b8b;--human:#f5f1f7;--human-edge:#786389;--gap:#fcf8ee;--gap-edge:#9c7e34;--arrow:#626b70}
@media(prefers-color-scheme:dark){svg{--paper:#18222a;--ink:#e8edf0;--record:#253a45;--record-edge:#8dbbc9;--human:#352c40;--human-edge:#b9a3c9;--gap:#3b3324;--gap-edge:#d4b263;--arrow:#c2ccd2}}
text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.box{fill:var(--record);stroke:var(--record-edge);stroke-width:2}.human{fill:var(--human);stroke:var(--record-edge)}.gap{fill:var(--gap);stroke:var(--gap-edge);stroke-dasharray:6 4}.arrow{stroke:var(--arrow);stroke-width:2;fill:none;marker-end:url(#tip)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="var(--arrow)"/></marker></defs>
<rect width="480" height="390" rx="12" fill="var(--paper)"/>
<g text-anchor="middle">
<rect class="box" x="20" y="20" width="440" height="130" rx="8"/>
<text class="head" x="240" y="57">Donor A · one visit</text>
<circle cx="240" cy="104" r="22" fill="var(--record-edge)"/><text x="330" y="112">one aliquot</text>
<rect class="box" x="20" y="178" width="440" height="145" rx="8"/>
<text class="head" x="240" y="215">Donor B · one visit</text>
<circle cx="105" cy="264" r="22" fill="var(--record-edge)"/><circle cx="175" cy="264" r="22" fill="var(--record-edge)"/><text x="320" y="272">two aliquots</text>
<text x="240" y="365">Illustrative tokens, not cohort counts</text>
</g></svg>
