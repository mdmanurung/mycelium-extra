<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532" role="img" aria-labelledby="title desc">
<title id="title">Compare recorded evidence before saving a check</title>
<desc id="desc">Verification reads the approved plan, receipts and output evidence; reports outcomes and missing evidence; then explicit confirmation precedes publication of saved provenance.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="532" rx="12"/>
<g text-anchor="middle">
<rect class="box" x="20" y="12" width="440" height="122" rx="8"/>
<text x="240" y="44" class="head">Read the existing evidence</text>
<text x="240" y="75">Approved plan, receipts and</text>
<text x="240" y="104">outputs</text>
<path class="arrow" d="M240 138v16"/>
<rect class="box" x="20" y="160" width="440" height="122" rx="8"/>
<text x="240" y="192" class="head">Compare it with the plan</text>
<text x="240" y="223">Keep conformity and qualification</text>
<text x="240" y="252">separate</text>
<path class="arrow" d="M240 286v16"/>
<rect class="gap" x="20" y="308" width="440" height="93" rx="8"/>
<text x="240" y="340" class="head">Read failures and gaps</text>
<text x="240" y="371">Missing evidence remains missing</text>
<path class="arrow" d="M240 405v16"/>
<rect class="focal" x="20" y="427" width="440" height="93" rx="8"/>
<text x="240" y="459" class="on-accent head">Confirm saving provenance</text>
<text class="on-accent" x="240" y="490">Save the recorded status as it is</text>
</g></svg>
