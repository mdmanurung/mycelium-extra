<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-labelledby="title desc">
<title id="title">Separate the historical episode from current re-pinning</title>
<desc id="desc">In the historical 0.9.44 episode an edited script blocked until reapproval. Current ordinary approved-script behavior is a re-pin notice; review and freeze remain explicit steps for reportable work.</desc>
<defs><style>svg{--paper:#f9fbfd;--paper-2:#edf1f4;--ink:#111921;--ink-2:#4d5660;--rule:#d9dfe3;--rule-strong:#bbc2c7;--accent:#00696f;--gap:#914a8c}@media(prefers-color-scheme:dark){svg{--paper:#0e1216;--paper-2:#161b20;--ink:#e3e9ed;--ink-2:#9ea6ab;--rule:#292f34;--rule-strong:#42494f;--accent:#64c3c8;--gap:#d997d2}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:var(--paper);stroke:var(--rule);stroke-width:2}.box{fill:var(--paper-2);stroke:var(--rule-strong);stroke-width:2}.human{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:2}.gap{fill:var(--paper);stroke:var(--gap);stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#tip)}#tip path{fill:var(--ink-2)}.dot{fill:var(--ink-2)}.focal{fill:var(--accent);stroke:var(--accent);stroke-width:2}.on-accent{fill:var(--paper)}.dot.on-accent{fill:var(--paper)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="215" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="12" y="12" width="222" height="185" rx="8"/>
<text x="123" y="44" class="head" style="font-size:22px">Then: 0.9.44</text>
<text x="123" y="77" style="font-size:21px">Edit blocked the</text>
<text x="123" y="106" style="font-size:21px">run</text>
<text x="123" y="135" style="font-size:21px">Reapproval was</text>
<text x="123" y="164" style="font-size:21px">needed</text>
<rect class="focal" x="246" y="12" width="222" height="185" rx="8"/>
<text x="357" y="44" class="on-accent head" style="font-size:20px">Current behavior</text>
<text class="on-accent" x="357" y="77" style="font-size:21px">Ordinary edit</text>
<text class="on-accent" x="357" y="106" style="font-size:21px">re-pins</text>
<text class="on-accent" x="357" y="135" style="font-size:21px">Read the change</text>
<text class="on-accent" x="357" y="164" style="font-size:21px">notice</text>
</g></svg>
