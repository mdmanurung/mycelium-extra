<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc">
  <title id="title">Your first plan, from setup to checking the record</title>
  <desc id="desc">Install, enable the gate, plan, type approval, run the covered steps, then verify the recorded evidence. Human approval and checking the record are different actions.</desc>
  <defs><style>text{font-family:system-ui,sans-serif;fill:#263238;font-size:23px}.box{fill:#f1f6f8;stroke:#527b8b;stroke-width:2}.human{fill:#f5f1f7;stroke:#786389;stroke-width:2}.arrow{stroke:#626b70;stroke-width:2;fill:none;marker-end:url(#tip)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#626b70"/></marker></defs>
  <rect width="480" height="490" rx="12" fill="#fff"/>
  <g text-anchor="middle">
    <rect class="box" x="20" y="12" width="440" height="60" rx="8"/><text x="240" y="50">1. Install for your host</text>
    <path class="arrow" d="M240 75v18"/>
    <rect class="box" x="20" y="96" width="440" height="60" rx="8"/><text x="240" y="134">2. Enable the gate with init</text>
    <path class="arrow" d="M240 159v18"/>
    <rect class="human" x="20" y="180" width="440" height="60" rx="8"/><text x="240" y="218">3. Plan choices and checks</text>
    <path class="arrow" d="M240 243v18"/>
    <rect class="human" x="20" y="264" width="440" height="60" rx="8"/><text x="240" y="302">4. You type plan approval</text>
    <path class="arrow" d="M240 327v18"/>
    <rect class="box" x="20" y="348" width="440" height="60" rx="8"/><text x="240" y="386">5. Run the covered steps</text>
    <path class="arrow" d="M240 411v18"/>
    <rect class="box" x="20" y="432" width="440" height="48" rx="8"/><text x="240" y="464">6. Verify the recorded evidence</text>
  </g>
</svg>
