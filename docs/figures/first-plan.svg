<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc">
  <title id="title">Your first plan, from setup to checking the record</title>
  <desc id="desc">Install, enable the gate, plan, type approval, run the covered steps, then verify the recorded evidence. Human approval and checking the record are different actions.</desc>
  <defs><style>svg{--paper:#f9fbfd;--paper-2:#edf1f4;--ink:#111921;--ink-2:#4d5660;--rule:#d9dfe3;--rule-strong:#bbc2c7;--accent:#00696f;--gap:#914a8c}@media(prefers-color-scheme:dark){svg{--paper:#0e1216;--paper-2:#161b20;--ink:#e3e9ed;--ink-2:#9ea6ab;--rule:#292f34;--rule-strong:#42494f;--accent:#64c3c8;--gap:#d997d2}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:23px}.head{font-weight:650}.bg{fill:var(--paper);stroke:var(--rule);stroke-width:2}.box{fill:var(--paper-2);stroke:var(--rule-strong);stroke-width:2}.human{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:2}.gap{fill:var(--paper);stroke:var(--gap);stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#tip)}#tip path{fill:var(--ink-2)}.dot{fill:var(--ink-2)}.focal{fill:var(--accent);stroke:var(--accent);stroke-width:2}.on-accent{fill:var(--paper)}.dot.on-accent{fill:var(--paper)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
  <rect class="bg" width="480" height="490" rx="12"/>
  <g text-anchor="middle">
    <rect class="box" x="20" y="12" width="440" height="60" rx="8"/><text x="240" y="50">1. Install for your host</text>
    <path class="arrow" d="M240 75v18"/>
    <rect class="box" x="20" y="96" width="440" height="60" rx="8"/><text x="240" y="134">2. Enable the gate with init</text>
    <path class="arrow" d="M240 159v18"/>
    <rect class="human" x="20" y="180" width="440" height="60" rx="8"/><text x="240" y="218">3. Plan choices and checks</text>
    <path class="arrow" d="M240 243v18"/>
    <rect class="focal" x="20" y="264" width="440" height="60" rx="8"/><text class="on-accent" x="240" y="302">4. You type plan approval</text>
    <path class="arrow" d="M240 327v18"/>
    <rect class="box" x="20" y="348" width="440" height="60" rx="8"/><text x="240" y="386">5. Run the covered steps</text>
    <path class="arrow" d="M240 411v18"/>
    <rect class="box" x="20" y="432" width="440" height="48" rx="8"/><text x="240" y="464">6. Verify the recorded evidence</text>
  </g>
</svg>
