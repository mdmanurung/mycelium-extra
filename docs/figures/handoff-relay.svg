<svg xmlns="http://www.w3.org/2000/svg" width="480" height="561" viewBox="0 0 480 561" role="img" aria-labelledby="title desc">
<title id="title">Carry the decisions and pointers, then recheck the current state</title>
<desc id="desc">A handoff carries next action, locked decisions, dead ends and source pointers. A fresh session must recheck the current approval and files; historical advice in a handoff is not automatically current authorization.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="561" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="20" y="12" width="440" height="122" rx="8"/>
<text x="240" y="44" class="on-accent head">Next action</text>
<text class="on-accent" x="240" y="75">What the next session should</text>
<text class="on-accent" x="240" y="104">inspect</text>
<rect class="human" x="20" y="160" width="440" height="93" rx="8"/>
<text x="240" y="192" class="head">Locked decisions</text>
<text x="240" y="223">Keep the predeclared reading rule</text>
<rect class="gap" x="20" y="279" width="440" height="122" rx="8"/>
<text x="240" y="311" class="head">Dead ends</text>
<text x="240" y="342">Do not repeat a recorded failed</text>
<text x="240" y="371">route</text>
<rect class="box" x="20" y="427" width="440" height="122" rx="8"/>
<text x="240" y="459" class="head">Source pointers</text>
<text x="240" y="490">Recheck the actual files and</text>
<text x="240" y="519">approval</text>
</g></svg>
