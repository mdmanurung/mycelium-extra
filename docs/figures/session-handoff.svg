<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532" role="img" aria-labelledby="title desc">
<title id="title">Carry context through a short document</title>
<desc id="desc">Session A writes a compact handoff with the goal, next action, locked decisions and dead ends. Session B reads it and checks the current state; it does not inherit approval or focus from the file.</desc>
<defs><style>svg{--paper:#f9fbfd;--paper-2:#edf1f4;--ink:#111921;--ink-2:#4d5660;--rule:#d9dfe3;--rule-strong:#bbc2c7;--accent:#00696f;--gap:#914a8c}@media(prefers-color-scheme:dark){svg{--paper:#0e1216;--paper-2:#161b20;--ink:#e3e9ed;--ink-2:#9ea6ab;--rule:#292f34;--rule-strong:#42494f;--accent:#64c3c8;--gap:#d997d2}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:var(--paper);stroke:var(--rule);stroke-width:2}.box{fill:var(--paper-2);stroke:var(--rule-strong);stroke-width:2}.human{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:2}.gap{fill:var(--paper);stroke:var(--gap);stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#tip)}#tip path{fill:var(--ink-2)}.dot{fill:var(--ink-2)}.focal{fill:var(--accent);stroke:var(--accent);stroke-width:2}.on-accent{fill:var(--paper)}.dot.on-accent{fill:var(--paper)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="532" rx="12"/>
<g text-anchor="middle">
<rect class="box" x="20" y="12" width="440" height="122" rx="8"/>
<text x="240" y="44" class="head">Session A: capture context</text>
<text x="240" y="75">Goal, next action and source</text>
<text x="240" y="104">pointers</text>
<path class="arrow" d="M240 138v16"/>
<rect class="box" x="20" y="160" width="440" height="93" rx="8"/>
<text x="240" y="192" class="head">Keep the locked decisions</text>
<text x="240" y="223">Include dead ends not to repeat</text>
<path class="arrow" d="M240 257v16"/>
<rect class="focal" x="20" y="279" width="440" height="93" rx="8"/>
<text x="240" y="311" class="on-accent head">Session B: check current state</text>
<text class="on-accent" x="240" y="342">A handoff can be stale or mistaken</text>
<path class="arrow" d="M240 376v16"/>
<rect class="gap" x="20" y="398" width="440" height="122" rx="8"/>
<text x="240" y="430" class="head">Re-establish what is needed</text>
<text x="240" y="461">The file restores no approval or</text>
<text x="240" y="490">focus</text>
</g></svg>
