<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532" role="img" aria-labelledby="title desc">
<title id="title">Read the request, approval and pins together</title>
<desc id="desc">Covered execution needs a matching approval in the session. Changed pinned inputs block. Ordinary script edits re-pin with a notice. Exploration needs its own typed grant. More exact execution contracts can add constraints.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="532" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="on-accent head">Covered run</text>
<text class="on-accent" x="240" y="75">Needs a matching session approval</text>
<rect class="box" x="20" y="131" width="440" height="122" rx="8"/>
<text x="240" y="163" class="head">Pinned input changed</text>
<text x="240" y="194">Recheck it and approve the revised</text>
<text x="240" y="223">plan</text>
<rect class="box" x="20" y="279" width="440" height="122" rx="8"/>
<text x="240" y="311" class="head">Ordinary script edited</text>
<text x="240" y="342">Re-pin notice; inspect before</text>
<text x="240" y="371">freezing</text>
<rect class="human" x="20" y="427" width="440" height="93" rx="8"/>
<text x="240" y="459" class="head">Exploration</text>
<text x="240" y="490">Needs its separate session grant</text>
</g></svg>
