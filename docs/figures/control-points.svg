<svg xmlns="http://www.w3.org/2000/svg" width="480" height="505" viewBox="0 0 480 505" role="img" aria-labelledby="title desc">
<title id="title">Seven places where the researcher retains control</title>
<desc id="desc">Consent, visibility, honesty, override, reversibility, boundary and attention name the control principles. They describe cooperative behavior, not an enforced security perimeter.</desc>
<defs><style>svg{--paper:#f9fbfd;--paper-2:#edf1f4;--ink:#111921;--ink-2:#4d5660;--rule:#d9dfe3;--rule-strong:#bbc2c7;--accent:#00696f;--gap:#914a8c}@media(prefers-color-scheme:dark){svg{--paper:#0e1216;--paper-2:#161b20;--ink:#e3e9ed;--ink-2:#9ea6ab;--rule:#292f34;--rule-strong:#42494f;--accent:#64c3c8;--gap:#d997d2}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:var(--paper);stroke:var(--rule);stroke-width:2}.box{fill:var(--paper-2);stroke:var(--rule-strong);stroke-width:2}.human{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:2}.gap{fill:var(--paper);stroke:var(--gap);stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#tip)}#tip path{fill:var(--ink-2)}.dot{fill:var(--ink-2)}.focal{fill:var(--accent);stroke:var(--accent);stroke-width:2}.on-accent{fill:var(--paper)}.dot.on-accent{fill:var(--paper)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="505" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="12" y="12" width="222" height="98" rx="8"/>
<text x="123" y="44" class="on-accent head" style="font-size:22px">Consent</text>
<text class="on-accent" x="123" y="77" style="font-size:21px">You approve</text>
<rect class="box" x="246" y="12" width="222" height="98" rx="8"/>
<text x="357" y="44" class="head" style="font-size:22px">Visibility</text>
<text x="357" y="77" style="font-size:21px">See the scope</text>
<rect class="gap" x="12" y="128" width="222" height="98" rx="8"/>
<text x="123" y="160" class="head" style="font-size:22px">Honesty</text>
<text x="123" y="193" style="font-size:21px">Gaps stay gaps</text>
<rect class="human" x="246" y="128" width="222" height="98" rx="8"/>
<text x="357" y="160" class="head" style="font-size:22px">Override</text>
<text x="357" y="193" style="font-size:21px">Refuse or revise</text>
<rect class="box" x="12" y="244" width="222" height="127" rx="8"/>
<text x="123" y="276" class="head" style="font-size:22px">Reversibility</text>
<text x="123" y="309" style="font-size:21px">Inspect records</text>
<rect class="box" x="246" y="244" width="222" height="127" rx="8"/>
<text x="357" y="276" class="head" style="font-size:22px">Boundary</text>
<text x="357" y="309" style="font-size:21px">Respect project</text>
<text x="357" y="338" style="font-size:21px">roles</text>
<rect class="human" x="12" y="389" width="222" height="98" rx="8"/>
<text x="123" y="421" class="head" style="font-size:22px">Attention</text>
<text x="123" y="454" style="font-size:21px">Read one decision</text>
</g></svg>
