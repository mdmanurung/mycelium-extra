<svg xmlns="http://www.w3.org/2000/svg" width="480" height="503" viewBox="0 0 480 503" role="img" aria-labelledby="title desc">
<title id="title">Add only the workflow layers your task needs</title>
<desc id="desc">Planning is the first tier. Add approval and receipts for execution, freeze and verification for reportable work, and project continuity tools when needed.</desc>
<defs><style>svg{--paper:#f9fbfd;--paper-2:#edf1f4;--ink:#111921;--ink-2:#4d5660;--rule:#d9dfe3;--rule-strong:#bbc2c7;--accent:#00696f;--gap:#914a8c}@media(prefers-color-scheme:dark){svg{--paper:#0e1216;--paper-2:#161b20;--ink:#e3e9ed;--ink-2:#9ea6ab;--rule:#292f34;--rule-strong:#42494f;--accent:#64c3c8;--gap:#d997d2}}text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:var(--paper);stroke:var(--rule);stroke-width:2}.box{fill:var(--paper-2);stroke:var(--rule-strong);stroke-width:2}.human{fill:var(--paper-2);stroke:var(--ink-2);stroke-width:2}.gap{fill:var(--paper);stroke:var(--gap);stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#tip)}#tip path{fill:var(--ink-2)}.dot{fill:var(--ink-2)}.focal{fill:var(--accent);stroke:var(--accent);stroke-width:2}.on-accent{fill:var(--paper)}.dot.on-accent{fill:var(--paper)}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="503" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">Tier 1: plan</text>
<text x="240" y="75">Clarify the question and choices</text>
<path class="arrow" d="M240 109v16"/>
<rect class="focal" x="20" y="131" width="440" height="93" rx="8"/>
<text x="240" y="163" class="on-accent head">Tier 2: approve runs</text>
<text class="on-accent" x="240" y="194">Add covered execution and receipts</text>
<path class="arrow" d="M240 228v16"/>
<rect class="box" x="20" y="250" width="440" height="93" rx="8"/>
<text x="240" y="282" class="head">Tier 3: verify</text>
<text x="240" y="313">Check reportable work and its gaps</text>
<path class="arrow" d="M240 347v16"/>
<rect class="box" x="20" y="369" width="440" height="122" rx="8"/>
<text x="240" y="401" class="head">Tier 4: project workflow</text>
<text x="240" y="432">Add structure, review and</text>
<text x="240" y="461">continuity</text>
</g></svg>
