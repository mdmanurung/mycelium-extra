<svg xmlns="http://www.w3.org/2000/svg" width="480" height="532" viewBox="0 0 480 532" role="img" aria-labelledby="title desc">
<title id="title">Turn a question into a sourced and checkable plan</title>
<desc id="desc">The researcher states the question first. Repository evidence, user choices and labelled defaults inform each plan row; each row names a check rather than silently assuming its choice is right.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="532" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">Your question comes first</text>
<text x="240" y="75">State it before a drafted answer</text>
<path class="arrow" d="M240 109v16"/>
<rect class="box" x="20" y="131" width="440" height="93" rx="8"/>
<text x="240" y="163" class="head">Inspect repository evidence</text>
<text x="240" y="194">Read the relevant records and data</text>
<path class="arrow" d="M240 228v16"/>
<rect class="focal" x="20" y="250" width="440" height="122" rx="8"/>
<text x="240" y="282" class="on-accent head">Make each choice visible</text>
<text class="on-accent" x="240" y="313">Source: repository, user or</text>
<text class="on-accent" x="240" y="342">default</text>
<path class="arrow" d="M240 376v16"/>
<rect class="box" x="20" y="398" width="440" height="122" rx="8"/>
<text x="240" y="430" class="head">Name a falsifiable check</text>
<text x="240" y="461">Say what would expose a wrong</text>
<text x="240" y="490">choice</text>
</g></svg>
