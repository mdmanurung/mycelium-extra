<svg xmlns="http://www.w3.org/2000/svg" width="480" height="503" viewBox="0 0 480 503" role="img" aria-labelledby="title desc">
<title id="title">Turn one recurring lesson into a demonstrated guard</title>
<desc id="desc">Select one concrete learning, confirm a reproduction, demonstrate that the test fails on that reproduction and passes on current code, then confirm updating the learning. A passing test covers only its reproduction.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="503" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">Choose one concrete learning</text>
<text x="240" y="75">Confirm the minimal reproduction</text>
<path class="arrow" d="M240 109v16"/>
<rect class="focal" x="20" y="131" width="440" height="122" rx="8"/>
<text x="240" y="163" class="on-accent head">Demonstrate the failure</text>
<text class="on-accent" x="240" y="194">The test must catch that</text>
<text class="on-accent" x="240" y="223">reproduction</text>
<path class="arrow" d="M240 257v16"/>
<rect class="box" x="20" y="279" width="440" height="93" rx="8"/>
<text x="240" y="311" class="head">Check the current code</text>
<text x="240" y="342">The same test must pass here</text>
<path class="arrow" d="M240 376v16"/>
<rect class="human" x="20" y="398" width="440" height="93" rx="8"/>
<text x="240" y="430" class="head">Confirm the learning update</text>
<text x="240" y="461">Record the shipped regression test</text>
</g></svg>
