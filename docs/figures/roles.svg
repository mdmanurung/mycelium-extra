<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355" role="img" aria-labelledby="title desc">
<title id="title">Three roles, with judgement left to the researcher</title>
<desc id="desc">The researcher decides, the agent proposes and executes within approved work, and the saved records show what was observed and what could not be checked.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="355" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="on-accent head">Researcher</text>
<text class="on-accent" x="240" y="75">Decide the question and choices</text>
<rect class="box" x="20" y="131" width="440" height="93" rx="8"/>
<text x="240" y="163" class="head">Agent</text>
<text x="240" y="194">Propose, implement and run</text>
<rect class="gap" x="20" y="250" width="440" height="93" rx="8"/>
<text x="240" y="282" class="head">Records</text>
<text x="240" y="313">Show observations and gaps</text>
</g></svg>
