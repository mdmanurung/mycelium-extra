<svg xmlns="http://www.w3.org/2000/svg" width="480" height="413" viewBox="0 0 480 413" role="img" aria-labelledby="title desc">
<title id="title">Keep analysis context, observed changes and history separate</title>
<desc id="desc">Focus names the analysis for the current session. Track changes compares approved intent and observations. The Journal exposes historical records and explicit coverage; none of these judges scientific impact.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="413" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">Focus</text>
<text x="240" y="75">Name this session’s analysis</text>
<rect class="focal" x="20" y="131" width="440" height="122" rx="8"/>
<text x="240" y="163" class="on-accent head">Track changes</text>
<text class="on-accent" x="240" y="194">Inspect differences and their</text>
<text class="on-accent" x="240" y="223">evidence</text>
<rect class="gap" x="20" y="279" width="440" height="122" rx="8"/>
<text x="240" y="311" class="head">Journal</text>
<text x="240" y="342">Read history with its coverage</text>
<text x="240" y="371">limits</text>
</g></svg>
