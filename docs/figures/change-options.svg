<svg xmlns="http://www.w3.org/2000/svg" width="480" height="384" viewBox="0 0 480 384" role="img" aria-labelledby="title desc">
<title id="title">Choose the action that matches the change</title>
<desc id="desc">An additive plan revision may use an amendment card. A freeze pins reviewed scripts for reportable work. A changed question, choice, input or threshold calls for a revised plan and approval.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="384" rx="12"/>
<g text-anchor="middle">
<rect class="human" x="20" y="12" width="440" height="93" rx="8"/>
<text x="240" y="44" class="head">Amend</text>
<text x="240" y="75">Add qualifying steps or scripts</text>
<rect class="focal" x="20" y="131" width="440" height="93" rx="8"/>
<text x="240" y="163" class="on-accent head">Freeze</text>
<text class="on-accent" x="240" y="194">Pin the scripts you reviewed</text>
<rect class="human" x="20" y="250" width="440" height="122" rx="8"/>
<text x="240" y="282" class="head">Re-scope</text>
<text x="240" y="313">Revise the question, choices or</text>
<text x="240" y="342">inputs</text>
</g></svg>
