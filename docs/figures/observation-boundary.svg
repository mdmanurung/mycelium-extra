<svg xmlns="http://www.w3.org/2000/svg" width="480" height="244" viewBox="0 0 480 244" role="img" aria-labelledby="title desc">
<title id="title">Inspected evidence has a limited boundary</title>
<desc id="desc">The tool can inspect covered runs, recorded receipts and declared evidence. Unobserved tools, unchecked method choices and scientific validity remain outside what those records establish.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#111921;font-size:22px}.head{font-size:24px;font-weight:650}.bg{fill:#f9fbfd;stroke:#d9dfe3;stroke-width:2}.box{fill:#edf1f4;stroke:#bbc2c7;stroke-width:2}.human{fill:#edf1f4;stroke:#4d5660;stroke-width:2}.gap{fill:#f9fbfd;stroke:#914a8c;stroke-width:2;stroke-dasharray:6 4}.arrow{stroke:#4d5660;stroke-width:2;fill:none;marker-end:url(#tip)}.dot{fill:#4d5660}.focal{fill:#00696f;stroke:#00696f;stroke-width:2}.on-accent{fill:#f9fbfd}.dot.on-accent{fill:#f9fbfd}</style><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#4d5660"/></marker></defs>
<rect class="bg" width="480" height="244" rx="12"/>
<g text-anchor="middle">
<rect class="focal" x="12" y="12" width="222" height="214" rx="8"/>
<text x="123" y="44" class="on-accent head" style="font-size:22px">Inspected</text>
<text class="on-accent" x="123" y="77" style="font-size:21px">Covered run</text>
<text class="on-accent" x="123" y="106" style="font-size:21px">records</text>
<text class="on-accent" x="123" y="135" style="font-size:21px">Declared checks</text>
<text class="on-accent" x="123" y="164" style="font-size:21px">Recorded outputs</text>
<rect class="gap" x="246" y="12" width="222" height="214" rx="8"/>
<text x="357" y="44" class="head" style="font-size:22px">Not established</text>
<text x="357" y="77" style="font-size:21px">Unobserved</text>
<text x="357" y="106" style="font-size:21px">execution</text>
<text x="357" y="135" style="font-size:21px">Method correctness</text>
<text x="357" y="164" style="font-size:21px">Scientific</text>
<text x="357" y="193" style="font-size:21px">validity</text>
</g></svg>
