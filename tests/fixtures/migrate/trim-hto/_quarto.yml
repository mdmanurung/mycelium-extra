project:
  type: website
  render: ["code/*.qmd"]
  output-dir: reports/site
  execute-dir: project
format:
  html:
    embed-resources: true
    toc: true
    code-fold: true
    theme:
      light: [default, reports/report.scss]
      dark: [default, reports/report.scss, reports/report-dark.scss]
    respect-user-color-scheme: true
